global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: loja-veloz
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8080"]
        labels: { service: gateway }
      - targets: ["pedidos:3001"]
        labels: { service: pedidos }
      - targets: ["pagamentos:3002"]
        labels: { service: pagamentos }
      - targets: ["estoque:3003"]
        labels: { service: estoque }
