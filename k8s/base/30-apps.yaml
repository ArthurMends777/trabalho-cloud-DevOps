# Deployments + Services dos microsserviços.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: loja-veloz
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: loja-veloz
spec:
  # "replicas" é omitido de propósito: quem controla o número de réplicas é o HPA.
  revisionHistoryLimit: 5
  minReadySeconds: 5
  strategy:
    type: RollingUpdate          # estratégia de deploy escolhida (ver README)
    rollingUpdate:
      maxSurge: 1                # sobe 1 pod novo antes de derrubar um antigo
      maxUnavailable: 0          # nunca reduz a capacidade durante o deploy
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: loja-veloz
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000          # usuário "node" da imagem
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:   # espalha as réplicas entre nós
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      containers:
        - name: gateway
          image: loja-veloz/gateway      # tag/registry definidos pelo overlay (kustomize "images")
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: loja-veloz-config
          env:
            - name: SERVICE_NAME
              value: gateway
            - name: PORT
              value: "8080"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          startupProbe:              # dá tempo para o app iniciar antes das demais probes
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:            # só recebe tráfego se estiver pronto (ex.: banco OK)
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:             # reinicia o contêiner se travar
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:                 # aguarda a remoção do endpoint antes de encerrar (sem erros 502)
              exec: { command: ["sleep", "5"] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: loja-veloz
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: loja-veloz
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 80
      targetPort: http
