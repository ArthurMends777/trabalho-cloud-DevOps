# Garante disponibilidade durante manutenção de nós (drain) e atualizações voluntárias.
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
  namespace: loja-veloz
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pedidos
  namespace: loja-veloz
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pedidos
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pagamentos
  namespace: loja-veloz
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pagamentos
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: estoque
  namespace: loja-veloz
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: estoque
