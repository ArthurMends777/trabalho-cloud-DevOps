# EXEMPLO - não é aplicado pelo kustomize e NÃO deve conter valores reais no Git.
# Crie o Secret no cluster de uma destas formas:
#
# 1) Direto (dev/local):
#    kubectl -n loja-veloz create secret generic loja-veloz-secrets \
#      --from-literal=POSTGRES_PASSWORD='...' \
#      --from-literal=PEDIDOS_DB_PASSWORD='...' \
#      --from-literal=ESTOQUE_DB_PASSWORD='...'
#
# 2) CI/CD: o pipeline cria/atualiza o Secret a partir dos GitHub Secrets (ver .github/workflows).
# 3) Produção madura: External Secrets Operator / Sealed Secrets / CSI Secrets Store (cofre na nuvem).
apiVersion: v1
kind: Secret
metadata:
  name: loja-veloz-secrets
  namespace: loja-veloz
type: Opaque
stringData:
  POSTGRES_PASSWORD: "<definir>"
  PEDIDOS_DB_PASSWORD: "<definir>"
  ESTOQUE_DB_PASSWORD: "<definir>"
